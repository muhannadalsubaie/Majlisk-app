# صور شاشات طاولات الدومينو والجاكارو واللودو في التطبيقين (بدون نشر أي شيء):
#  • أندرويد: تُرسم الشاشات في اختبار على الكمبيوتر (Robolectric + Roborazzi) من حالات لعب حقيقية.
#  • آيفون: يُشغَّل التطبيق في محاكي آيفون بوضع "طاولة تجريبية" (نسخة التطوير فقط) وتُلتقط الشاشة.
# النتيجة في Artifacts بنهاية التشغيل.
name: Screenshots

on:
  workflow_dispatch:

# الصور تنحفظ بعد في فرع shots-<المنصة> (للمراجعة بدون تنزيل الـ Artifacts)
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Render tables
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests com.majlisk.app.TableShots --no-daemon --stacktrace
          ls -la app/build/shots
      - name: Save to branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/out && cp android/app/build/shots/*.png /tmp/out/ 2>/dev/null || true
          git config user.name "majlisk-shots"; git config user.email "shots@users.noreply.github.com"
          git checkout --orphan shots-android
          git rm -rf -q . || true
          cp /tmp/out/*.png . 2>/dev/null || true
          git add -A && git commit -qm "shots" && git push -f origin shots-android || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shots
          path: android/app/build/shots/*.png

  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Majlisk.xcodeproj -scheme Majlisk -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD" | head -n 80
      - name: Screenshots in the simulator
        working-directory: ios
        run: |
          APP=$(ls -d build/Build/Products/Debug-iphonesimulator/*.app | head -1)
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro Max' not in x['name'] and 'SE' not in x['name']]
          print(c[-1]['udid'])")
          echo "device $UDID app $APP id $BID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          for g in domino jackaroo ludo; do
            xcrun simctl terminate "$UDID" "$BID" || true
            xcrun simctl launch "$UDID" "$BID" -demoTable $g
            sleep 12
            xcrun simctl io "$UDID" screenshot "shots/ios-$g.png"
          done
          ls -la shots
      - name: Save to branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/out && cp ios/shots/*.png /tmp/out/ 2>/dev/null || true
          git config user.name "majlisk-shots"; git config user.email "shots@users.noreply.github.com"
          git checkout --orphan shots-ios
          git rm -rf -q . || true
          cp /tmp/out/*.png . 2>/dev/null || true
          git add -A && git commit -qm "shots" && git push -f origin shots-ios || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-shots
          path: ios/shots/*.png

  # نحفظ الصور في فرع "screenshots" بالمستودع (أسهل للعرض من ملفات Artifacts)
  collect:
    needs: [android, ios]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: shots
          merge-multiple: true
      - name: Push to the screenshots branch
        run: |
          ls -la shots
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
