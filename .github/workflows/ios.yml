# بناء تطبيق الآيفون (Swift) على ماك سحابي.
# مع كل تعديل: يُبنى فقط للتأكد أن الكود سليم، بلا رفع.
# الرفع إلى TestFlight يدوي فقط (Actions ← iOS ← Run workflow ← upload = true)، حين يطلبه صاحب التطبيق،
# ومع public_link = true تنضاف النسخة بعده لمختبرين الرابط العام وتنرسل للمراجعة (مهمة testers)،
# أو لاحقاً من Actions ← TestFlight public link (لنسخة مرفوعة من قبل).
# المستودع خاص: دقائق الماك محدودة، فالانتظار بعد الرفع على لينكس.
# الأسرار: APPLE_TEAM_ID، ASC_KEY_ID، ASC_ISSUER_ID، ASC_KEY_P8 (مفتاح App Store Connect بصلاحية Admin).
# مشروع Xcode يُولَّد من ios/project.yml بأداة XcodeGen.
name: iOS

on:
  push:
    paths:
      - ios/**
      - .github/workflows/ios.yml
  workflow_dispatch:
    inputs:
      upload:
        description: رفع النسخة إلى TestFlight
        type: boolean
        default: false
      public_link:
        description: إضافة النسخة لرابط المختبرين الخارجيين (بعد الرفع)
        type: boolean
        default: false
      runner:
        description: نوع جهاز الماك (لو نوع ما يتوفر نجرب الثاني)
        type: choice
        options: [macos-26, macos-15-intel]
        default: macos-26

# فحص البناء (مع كل تعديل) والرفع (يدوي) في مجموعتين منفصلتين، فلا يلغي تعديلٌ جديد رفعاً ينتظر دوره
concurrency: ios-${{ github.event_name }}-${{ inputs.runner || 'macos-26' }}

jobs:
  build:
    # ماك Intel: أجهزة Apple Silicon عند GitHub مزدحمة (لم تُستلم المهمة)
    # أجهزة ماك macOS 26 (فيها Xcode 26 اللي تطلبه Apple): Intel وmacos-15 كانت البناءات تنتظرها لين تنلغي
    # يدوياً نقدر نختار Intel (macos-15-intel) لو أجهزة macos-26 مزدحمة
    runs-on: ${{ inputs.runner || 'macos-26' }}
    env:
      HAS_KEYS: ${{ secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
    steps:
      - uses: actions/checkout@v4
      # Apple لا تقبل الرفع إلا بـ Xcode 26: نختار أحدث Xcode 26 مثبت
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; else echo "::warning::no Xcode 26 on this image"; ls /Applications | grep -i xcode; fi
          xcodebuild -version
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Resolve packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project Majlisk.xcodeproj -scheme Majlisk | tail -n 20
      - name: Build for simulator (check only, no upload)
        if: env.UPLOAD != 'true'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Majlisk.xcodeproj -scheme Majlisk -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee $RUNNER_TEMP/build.log | grep -E "error:|BUILD" | head -n 80
      - name: Archive and upload to TestFlight
        if: env.HAS_KEYS == 'true' && env.UPLOAD == 'true'
        working-directory: ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          KEY=$RUNNER_TEMP/AuthKey_$KEY_ID.p8
          printf '%s' "$KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          # التوقيع التلقائي يحتاج جهازاً مسجلاً واحداً على الأقل، وشهادة تطوير جديدة لهذا الماك
          KEY="$KEY" node ../.github/scripts/asc-ensure-device.mjs
          # رقم البناء أعلى من أرقام التطبيق الحالي (تلك تبدأ من 100)
          BUILD=$((1000 + ${{ github.run_number }}))
          xcodebuild -project Majlisk.xcodeproj -scheme Majlisk -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$BUILD \
            $AUTH archive 2>&1 | tee $RUNNER_TEMP/build.log | grep -E "error:|ARCHIVE" | head -n 80
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/export $AUTH 2>&1 | tail -n 30
          echo "### رُفعت النسخة $BUILD إلى App Store Connect — تظهر في TestFlight بعد المعالجة (10–30 دقيقة)" >> $GITHUB_STEP_SUMMARY
      - name: Build log (on failure)
        if: failure()
        run: tail -n 200 $RUNNER_TEMP/build.log 2>/dev/null || true

  # بعد الرفع: تنتظر المعالجة، ثم تضيف النسخة لمختبرين TestFlight الخارجيين (الرابط العام) وترسلها للمراجعة.
  # على لينكس (أرخص من الماك)، والانتظار هنا بدل ما يوقف الماك.
  testers:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload && inputs.public_link
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: External testers (public link)
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY=$RUNNER_TEMP/k.p8; printf '%s' "$KEY_P8" > $KEY
          # بلا "وش الجديد": المختبر يفتح التطبيق على طول بدون قائمة تعديلات
          KEY=$KEY BUILD=$((1000 + ${{ github.run_number }})) \
            node .github/scripts/asc-external.mjs | tee -a $GITHUB_STEP_SUMMARY
