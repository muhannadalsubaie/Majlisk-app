# أداة فحص مؤقتة: تبحث في ملفات WebRTC (stasel) عن خيارات معالجة الصوت (لينكس، بلا ماك)
name: WebRTC headers

on:
  workflow_dispatch:

jobs:
  grep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Headers
        run: |
          URL=$(curl -sSL "https://raw.githubusercontent.com/stasel/WebRTC/125.0.0/Package.swift" | grep -o 'https://[^"]*zip')
          curl -sSL -o w.zip "$URL"; unzip -q -o w.zip -d w
          D=$(dirname $(find w -path '*ios-arm64/*' -name 'RTCPeerConnectionFactory.h' | head -1))
          sed -n 30,70p $D/RTCPeerConnectionFactory.h
          echo "===== RTCAudioDevice.h"
          grep -v '^ \*\|^/\*\|^$' $D/RTCAudioDevice.h
