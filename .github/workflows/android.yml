# بناء تطبيق الأندرويد (Kotlin) عند كل تعديل، ونشره كإصدار "android-latest" للتنزيل المباشر.
# التوقيع بنفس مفتاح التطبيق الحالي (android/keystore/upload.jks.enc مشفّراً بـ ANDROID_KEYSTORE_PASSWORD)،
# فتُثبَّت النسخة الجديدة فوق القديمة مباشرة. ورقم الإصدار يبدأ من 10000 ليكون أعلى من أرقام التطبيق الحالي.
# وإن وُجد سر PLAY_SERVICE_ACCOUNT_JSON يُرفع الـ AAB إلى الاختبار الداخلي في Google Play.
name: Android

on:
  push:
    paths:
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency: android-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        id: key
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PASS" ]; then echo "signed=false" >> $GITHUB_OUTPUT; echo "no ANDROID_KEYSTORE_PASSWORD — debug build"; exit 0; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in android/keystore/upload.jks.enc -out /tmp/upload.jks -pass env:PASS
          echo "signed=true" >> $GITHUB_OUTPUT
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.signed == 'true' && '/tmp/upload.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease bundleRelease -PVERSION_CODE=$((10000 + ${{ github.run_number }})) --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../majlisk.apk
            cp app/build/outputs/bundle/release/app-release.aab ../majlisk.aab
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../majlisk.apk
          fi
      - name: Publish android-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: مجلسك — أحدث نسخة أندرويد (التطبيق الأصلي)
          body: "تُبنى تلقائياً من آخر تعديل (${{ github.sha }}). majlisk.apk للتثبيت على الجوال، و majlisk.aab للرفع إلى Google Play."
          prerelease: true
          files: |
            majlisk.apk
            majlisk.aab
      - name: Upload to Google Play (internal testing)
        id: play
        if: steps.key.outputs.signed == 'true' && env.HAS_PLAY == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.majlisk.app
          releaseFiles: majlisk.aab
          track: internal
          status: completed
      - name: Upload to Google Play as draft (app not published yet)
        if: steps.play.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.majlisk.app
          releaseFiles: majlisk.aab
          track: internal
          status: draft
