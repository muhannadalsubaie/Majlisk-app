# إضافة نسخة مرفوعة من قبل لرابط المختبرين الخارجيين (TestFlight العام) وإرسالها للمراجعة.
# Actions ← TestFlight public link ← Run workflow ← رقم النسخة (مثل 1075)
name: TestFlight public link

on:
  workflow_dispatch:
    inputs:
      build:
        description: رقم النسخة (CFBundleVersion)
        required: true
      runner:
        description: الجهاز (لو لينكس موقوف نشغلها على ماك)
        type: choice
        options: [ubuntu-latest, macos-15-intel, macos-26]
        default: ubuntu-latest

jobs:
  testers:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: External testers (public link)
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: ${{ inputs.build }}
        run: |
          KEY=$RUNNER_TEMP/k.p8; printf '%s' "$KEY_P8" > $KEY
          awk '/^## تحديث/{n++} n==1' CHANGELOG.md > $RUNNER_TEMP/notes.txt
          KEY=$KEY NOTES=$RUNNER_TEMP/notes.txt node .github/scripts/asc-external.mjs | tee -a $GITHUB_STEP_SUMMARY
