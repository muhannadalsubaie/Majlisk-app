# إضافة باقات العملات (الشراء من داخل التطبيق) في Google Play — ما يرفع أي نسخة
name: Play products
on: workflow_dispatch
jobs:
  products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/scripts/play-products.mjs | tee -a $GITHUB_STEP_SUMMARY; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
