# يجمع أصواتاً بديلة مسجّلة (حزم Kenney، رخصة CC0) لتجربتها قبل اعتمادها، ويحفظها في فرع sound-candidates.
# لا يغيّر أصوات التطبيق. يعمل عند الطلب فقط.
name: Sound candidates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Kenney packs
        run: |
          set -e
          for pack in music-jingles casino-audio interface-sounds rpg-audio impact-sounds ui-audio; do
            PAGE=$(curl -sL --max-time 300 "https://kenney.nl/assets/$pack")
            ZIP=$(echo "$PAGE" | grep -oE "https?://[^\"' ]+\.zip" | head -1)
            [ -n "$ZIP" ] || ZIP=$(echo "$PAGE" | grep -oE "/media/pages/assets/[^\"' ]+\.zip" | head -1 | sed 's#^#https://kenney.nl#')
            echo "$pack: $ZIP (page $(echo "$PAGE" | wc -c) bytes)"
            [ -n "$ZIP" ] || echo "$PAGE" | grep -oiE "(href|data-[a-z-]+)=\"[^\"]*(download|zip)[^\"]*\"" | head -5
            [ -n "$ZIP" ] || continue
            curl -sL --max-time 300 "$ZIP" -o "/tmp/$pack.zip"
            mkdir -p "/tmp/packs/$pack" && unzip -o -q "/tmp/$pack.zip" -d "/tmp/packs/$pack"
          done
      - name: Convert
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          rm -rf candidates && mkdir -p candidates
          find /tmp/packs -type f \( -iname "*.ogg" -o -iname "*.wav" \) | while read f; do
            pack=$(echo "$f" | sed 's#/tmp/packs/\([^/]*\)/.*#\1#')
            name=$(basename "$f" | sed 's/\.[^.]*$//' | tr ' ' '_')
            ffmpeg -nostdin -loglevel error -y -i "$f" -ac 1 -ar 44100 -b:a 64k "candidates/${pack}__${name}.mp3"
          done
          find /tmp/packs -iname "*licen*" -exec cat {} \; | head -40 > candidates/LICENSES.txt
          ls candidates | wc -l; du -sh candidates
      - name: Save to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan sound-candidates
          git rm -rq --cached . && find . -maxdepth 1 ! -name . ! -name .git ! -name candidates -exec rm -rf {} +
          git add candidates
          git commit -qm "Sound candidates (Kenney, CC0)"
          git push -f origin sound-candidates
