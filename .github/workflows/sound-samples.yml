# تنزيل حزم أصوات مجانية (Kenney، رخصة CC0) لاختيار أصوات جديدة — يدفعها لفرع sound-samples (ما تدخل التطبيق)
name: Sound samples
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download packs
        run: |
          mkdir -p out && cd out
          for a in casino-audio impact-sounds interface-sounds rpg-audio music-jingles digital-audio ui-audio; do
            page=$(curl -sL -c jar.txt -b jar.txt -A "Mozilla/5.0" "https://kenney.nl/assets/$a")
            id=$(echo "$page" | grep -oE "data-download-id='[0-9a-f]+'" | head -1 | cut -d"'" -f2)
            resp=$(curl -sL -c jar.txt -b jar.txt -A "Mozilla/5.0" -H "Referer: https://kenney.nl/assets/$a" "https://kenney.nl/download-link/$id")
            echo "$a id=$id resp=${resp:0:300}"
            url=$(echo "$resp" | grep -oE 'https:[^"]+' | head -1 | sed 's#\\/#/#g')
            [ -n "$url" ] || continue
            curl -sL -A "Mozilla/5.0" "$url" -o "$a.zip" && mkdir -p "$a" && unzip -q -o "$a.zip" -d "$a" && rm "$a.zip" || echo "unzip failed $a"
          done
          rm -f jar.txt
          find . -type f \( -iname '*.ogg' -o -iname '*.wav' -o -iname '*.mp3' \) | wc -l
          chmod -R u+w . ; find . -type f ! \( -iname '*.ogg' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.txt' \) -exec rm -f {} + || true
      - name: Push to sound-samples branch
        run: |
          cd out
          git init -q -b sound-samples
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Kenney CC0 sound packs"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sound-samples
